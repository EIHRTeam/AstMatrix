name: Release

# Same-commit payloads -> Windows installers -> verified assets -> tag and release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  prepare:
    name: Check and prepare release packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main branch
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::Release must be triggered from main'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read and verify release version
        id: version
        run: node tooling/packaging/prepare.mjs --version-only
      - name: Ensure release tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists; bump package.json and the host manifests first"
            exit 1
          fi
      - run: pnpm check
      - name: Build and verify host bundles
        run: |
          pnpm build:illustrator
          pnpm build:photoshop
          pnpm build:figma
          pnpm check:host-bundles
      - name: Assemble release packages
        run: node tooling/packaging/prepare.mjs --with-figma
      - uses: actions/upload-artifact@v7
        with:
          name: release-payload-${{ steps.version.outputs.version }}
          path: release/*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  installers:
    name: Compile Windows installers
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build-inno
        with:
          payload-artifact: release-payload-${{ needs.prepare.outputs.version }}
          installer-artifact: release-installers-${{ needs.prepare.outputs.version }}

  publish:
    name: Verify and publish release
    needs: [prepare, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: release-payload-${{ needs.prepare.outputs.version }}
          path: tmp/release-payload
      - uses: actions/download-artifact@v8
        with:
          name: release-installers-${{ needs.prepare.outputs.version }}
          path: tmp/release-installers
      - name: Verify all five assets and their provenance
        run: node tooling/packaging/verify-release.mjs
      - name: Upload complete release artifact
        uses: actions/upload-artifact@v7
        with:
          name: AstMatrix-${{ needs.prepare.outputs.version }}
          path: release/*
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" \
            -f "sha=${GITHUB_SHA}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
