name: Release

# Same-commit payloads -> signed ZXP and Windows installers -> verified assets -> release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  prepare:
    name: Check and prepare release packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main branch
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::Release must be triggered from main'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read and verify release version
        id: version
        run: node tooling/packaging/prepare.mjs --version-only
      - name: Ensure release tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists; bump package.json and the host manifests first"
            exit 1
          fi
      - run: pnpm check
      - name: Build and verify host bundles
        run: |
          pnpm build:illustrator
          pnpm build:photoshop
          pnpm build:figma
          pnpm check:host-bundles
      - name: Assemble release packages
        run: node tooling/packaging/prepare.mjs --with-figma
      - uses: actions/upload-artifact@v7
        with:
          name: release-payload-${{ steps.version.outputs.version }}
          path: release/*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  installers:
    name: Compile Windows installers
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build-inno
        with:
          payload-artifact: release-payload-${{ needs.prepare.outputs.version }}
          installer-artifact: release-installers-${{ needs.prepare.outputs.version }}

  sign-illustrator:
    name: Sign Illustrator ZXP
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 15
    # Secrets: base64 of local ./AstMatrix.p12 and its password.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: release-payload-${{ needs.prepare.outputs.version }}
          path: tmp/release-payload
      - name: Download pinned Adobe ZXPSignCmd
        shell: pwsh
        run: |
          $url = 'https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/ab5e4e3e53a42fad08e1225a22a991bb1ffe73f6/ZXPSignCMD/4.1.3/x64/ZXPSignCmd.exe'
          curl.exe -fsSL --retry 3 $url -o tmp/ZXPSignCmd.exe
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download ZXPSignCmd.exe' }
          $actual = (Get-FileHash tmp/ZXPSignCmd.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'ffc2223167225ce61d024eb463fc5ad1a1be16133f99ef334a646f7311916c98') {
            throw 'ZXPSignCmd.exe SHA-256 mismatch'
          }
      - name: Sign and verify Illustrator ZXP
        shell: pwsh
        env:
          ASTMATRIX_P12_BASE64: ${{ secrets.ASTMATRIX_P12_BASE64 }}
          ASTMATRIX_P12_PASSWORD: ${{ secrets.ASTMATRIX_P12_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if (-not $env:ASTMATRIX_P12_BASE64 -or -not $env:ASTMATRIX_P12_PASSWORD) {
            throw 'Configure ASTMATRIX_P12_BASE64 and ASTMATRIX_P12_PASSWORD secrets'
          }
          $certificate = Join-Path $env:GITHUB_WORKSPACE 'AstMatrix.p12'
          $package = "tmp/release-signed/AstMatrix-Illustrator-$env:VERSION.zxp"
          try {
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:ASTMATRIX_P12_BASE64))
            New-Item -ItemType Directory -Force tmp/zxp-source, tmp/release-signed | Out-Null
            Expand-Archive -LiteralPath "tmp/release-payload/AstMatrix-Illustrator-$env:VERSION.zip" -DestinationPath tmp/zxp-source
            if (-not (Test-Path tmp/zxp-source/CSXS/manifest.xml -PathType Leaf)) {
              throw 'Illustrator manifest missing from payload'
            }
            & ./tmp/ZXPSignCmd.exe -sign tmp/zxp-source $package $certificate $env:ASTMATRIX_P12_PASSWORD -tsa http://timestamp.digicert.com
            if ($LASTEXITCODE -ne 0) { throw 'ZXPSignCmd.exe failed to sign' }
            $verification = & ./tmp/ZXPSignCmd.exe -verify $package -certInfo 2>&1
            $verifyExitCode = $LASTEXITCODE
            $verification | Write-Output
            if ($verifyExitCode -ne 0) { throw 'ZXPSignCmd.exe failed to verify' }
            if (($verification -join "`n") -notmatch '(?m)^\s*Timestamp:\s*Valid\b') {
              throw 'Signed ZXP has no valid trusted timestamp'
            }
            if (-not (Test-Path $package -PathType Leaf)) { throw 'Signed ZXP missing' }
            $signingCertificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $certificate, $env:ASTMATRIX_P12_PASSWORD
            )
            try {
              if (-not $signingCertificate.HasPrivateKey) { throw 'Signing certificate has no private key' }
              $hash = $signingCertificate.GetCertHashString([System.Security.Cryptography.HashAlgorithmName]::SHA256)
              if ($hash -notmatch '^[0-9A-F]{64}$') { throw 'Invalid certificate SHA-256 fingerprint' }
              $fingerprint = [regex]::Replace($hash, '..(?!$)', '$&:')
              $fingerprintFile = "tmp/release-signed/AstMatrix-Illustrator-$env:VERSION-Certificate-SHA256.txt"
              Set-Content -LiteralPath $fingerprintFile -Encoding ascii -Value "SHA-256 (X.509 certificate): $fingerprint"
            } finally {
              $signingCertificate.Dispose()
            }
          } finally {
            Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
          }
      - name: Record signed package provenance
        run: node tooling/packaging/record-signed.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: release-signed-${{ needs.prepare.outputs.version }}
          path: tmp/release-signed/*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  installers-arm64:
    name: Verify Windows ARM64 installers
    needs: [prepare, installers]
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/test-inno-arm64
        with:
          installer-artifact: release-installers-${{ needs.prepare.outputs.version }}

  publish:
    name: Verify and publish release
    needs: [prepare, sign-illustrator, installers, installers-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: release-payload-${{ needs.prepare.outputs.version }}
          path: tmp/release-payload
      - uses: actions/download-artifact@v8
        with:
          name: release-installers-${{ needs.prepare.outputs.version }}
          path: tmp/release-installers
      - uses: actions/download-artifact@v8
        with:
          name: release-signed-${{ needs.prepare.outputs.version }}
          path: tmp/release-signed
      - name: Verify all eight assets and their provenance
        run: node tooling/packaging/verify-release.mjs
      - name: Attest every release asset
        uses: actions/attest@v4
        with:
          subject-path: 'release/*'
      - name: Upload complete release artifact
        uses: actions/upload-artifact@v7
        with:
          name: AstMatrix-${{ needs.prepare.outputs.version }}
          path: release/*
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" \
            -f "sha=${GITHUB_SHA}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
