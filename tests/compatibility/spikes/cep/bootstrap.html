<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>M0 bundle selector</title>
    <link rel="stylesheet" href="style.css" />
    <!-- M0_INLINE_STYLE -->
    <script src="../CSInterface.js"></script>
    <script src="select-profile.js"></script>
  </head>
  <body>
    <h2 class="text-lg font-semibold mb-2">M0 Compiler 对照 · hotfix-03 · shadcn/ui</h2>
    <p class="text-sm text-muted-foreground mb-4">选择模式进入编码面板；可在面板中返回此页切换。</p>
    <p id="status" role="status">正在读取 CEP 运行时…</p>
    <details class="my-4 rounded-md border p-3">
      <summary>运行时记录</summary>
      <pre id="runtime"></pre>
    </details>
    <button
      class="inline-flex h-9 items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground mr-2 disabled:opacity-50"
      id="on"
      type="button"
      disabled
    >
      Compiler 开
    </button>
    <button
      class="inline-flex h-9 items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground mr-2 disabled:opacity-50"
      id="off"
      type="button"
      disabled
    >
      Compiler 关
    </button>
    <script>
      (function () {
        var cep, host;
        try {
          var cs = new CSInterface();
          cep = cs.getCurrentApiVersion();
          host = cs.getHostEnvironment();
          var profile = selectM0Profile(cep, host);
          document.getElementById('status').textContent =
            'CEP ' + cep.major + '.' + cep.minor + '.' + cep.micro + ' / ' + profile;
          document.getElementById('runtime').textContent = JSON.stringify({
            cep: cep,
            host: host,
            profile: profile,
          });
          function load(mode) {
            window.location.href = '../web/' + profile + '/' + mode + '/index.html';
          }
          document.getElementById('on').onclick = function () {
            load('on');
          };
          document.getElementById('off').onclick = function () {
            load('off');
          };
          document.getElementById('on').disabled = false;
          document.getElementById('off').disabled = false;
        } catch (error) {
          document.getElementById('status').textContent = String(error);
          document.getElementById('runtime').textContent =
            String(error) + '\n' + JSON.stringify({ cep: cep, host: host });
        }
      })();
    </script>
  </body>
</html>
