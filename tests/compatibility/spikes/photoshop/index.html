<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>M0 Photoshop</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        background: #303030;
        color: #eee;
        font-size: 13px;
      }
      #panel-header {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 44px;
        padding: 10px 12px;
      }
      h2 {
        font-size: 16px;
        margin: 0;
      }
      #panel-content {
        position: absolute;
        left: 0;
        right: 0;
        top: 44px;
        bottom: 78px;
        overflow: auto;
        padding: 12px;
      }
      #status-dock {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 78px;
        padding: 8px 12px;
        border-top: 1px solid #777;
        background: #303030;
      }
      .samples,
      .actions {
        display: flex;
        flex-wrap: wrap;
      }
      .samples button,
      .actions button {
        width: 48%;
        margin-right: 2%;
      }
      button {
        margin-bottom: 8px;
        padding: 6px;
        min-height: 32px;
        background: #e6e6e6;
        color: #111;
        border: 1px solid #999;
      }
      button:disabled {
        color: #777;
      }
      .selected {
        background: #cfe1ff;
        border-color: #669cff;
      }
      p {
        margin: 0 0 10px;
      }
      label {
        display: block;
        margin-top: 10px;
      }
      textarea {
        display: block;
        width: 100%;
        height: 180px;
        font-size: 12px;
        background: #202020;
        color: #eee;
        border: 1px solid #888;
        padding: 8px;
      }
      #status {
        height: 24px;
        margin: 0;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #show-log {
        width: 100%;
        margin-bottom: 0;
        flex-shrink: 0;
      }
      dialog {
        padding: 16px;
      }
      dialog input,
      dialog button {
        display: block;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <header id="panel-header"><h2>AstMatrix M0 · hotfix-03</h2></header>
    <div id="panel-content">
      <p>在空白测试文档操作。RGB/CMYK × 72/300/600 DPI 分别执行。</p>
      <div class="samples">
        <button id="sample-qr" class="selected">QR 多子路径</button>
        <button id="sample-primitives">矩形与曲线</button>
      </div>
      <div class="actions">
        <button id="insert">插入 Shape Layer</button>
        <button id="fail">注入失败/回滚</button>
        <button id="read">读取所选层参数</button>
        <button id="stress">写入约 16 KiB 参数</button>
        <button id="dialog">原生 Dialog</button>
      </div>
      <label for="log">完整运行记录</label>
      <textarea id="log" readonly></textarea>
    </div>
    <footer id="status-dock">
      <p id="status">准备就绪</p>
      <button id="show-log">查看 / 复制完整日志</button>
    </footer>
    <script src="index.js"></script>
  </body>
</html>
